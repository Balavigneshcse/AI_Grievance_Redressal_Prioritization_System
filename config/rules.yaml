# Routing rules. Rules win over the model: a matched department overrides the
# LLM's department, urgency_floor raises (never lowers) urgency, and
# force_review sends the complaint to a human regardless of confidence.
# Keywords are matched case-insensitively against the original text, so include
# Tamil script, Devanagari and romanised spellings. Hot-reloaded on save.
# Matching is by word: English keywords match whole words ('fire' not 'fired'); Tamil and Hindi
# keywords must start a word, and short ones (three letters or fewer, e.g. தீ, आग, नाग, பட்டா)
# must be the whole word or take a case ending (தீயில், சாலையில், सांपों), so தீர்வு, आगे, आग्रह,
# नागरिक and பட்டாசு no longer match. List other inflected forms explicitly when a stem changes.

rules:
  - id: R1
    name: Gas leak
    enabled: true
    match:
      keywords: ["gas leak", "gas leaking", "smell of gas", "gas smell", "கேஸ் லீக்", "எரிவாயு கசிவு", "gas ki badbu", "gas leak ho raha", "गैस लीक", "गैस की बदबू", "gas kasivu"]
    action:
      department: safety
      urgency_floor: critical
      force_review: true

  - id: R2
    name: Medical dependency on power
    enabled: true
    match:
      keywords: ["oxygen", "ஆக்ஸிஜன்", "ऑक्सीजन", "dialysis", "டயாலிசிஸ்", "डायलिसिस", "ventilator", "வென்டிலேட்டர்", "वेंटिलेटर", "insulin"]
    action:
      urgency_floor: critical
      force_review: true

  - id: R3
    name: Exposed or hanging electric wire
    enabled: true
    match:
      keywords: ["hanging wire", "exposed wire", "live wire", "wire hanging", "wires hanging", "கம்பி தொங்க", "கம்பிகள் தொங்க", "மின் கம்பி", "tar latak", "तार लटक", "नंगा तार", "khula tar", "electric pole leaning", "மின்கம்பம் சாய்ந்து", "खंभा झुक"]
    action:
      department: safety
      urgency_floor: critical
      force_review: true

  - id: R4
    name: Fire or collapse
    enabled: true
    match:
      keywords: ["fire", "on fire", "தீ", "தீப்பிடித்த", "आग", "aag lag", "collapse", "collapsing", "இடிந்து", "गिरने वाला", "building crack", "wall falling", "आगजनी", "தீயணைப்பு"]
    action:
      department: safety
      urgency_floor: critical
      force_review: true

  - id: R5
    name: Water supply keywords
    enabled: true
    match:
      keywords: ["thanni", "thanneer", "தண்ணீர்", "குடிநீர்", "paani", "pani nahi", "पानी", "water supply", "no water", "water not coming", "water nahi"]
    action:
      department: water

  - id: R5b
    name: Street light
    enabled: true
    match:
      keywords: ["street light", "streetlight", "street lamp", "தெருவிளக்கு", "தெரு விளக்கு", "स्ट्रीट लाइट", "street light band", "light band hai", "light not working", "light illa", "light eriyala", "light nahi jal"]
    action:
      department: roads

  - id: R6
    name: Sewage overflow into homes
    enabled: true
    match:
      keywords: ["sewage inside", "sewage entering", "drainage water inside", "கழிவுநீர் வீட்டுக்குள்", "कीचड़ घर में", "नाली का पानी घर में", "sewage overflow"]
    action:
      department: sanitation
      urgency_floor: high

  - id: R7
    name: Dengue or disease cluster
    enabled: true
    match:
      keywords: ["dengue", "டெங்கு", "डेंगू", "malaria", "மலேரியா", "मलेरिया", "cholera", "typhoid", "many people sick", "fever cases"]
    action:
      department: health
      urgency_floor: high

  - id: R8
    name: Repeat complaint
    enabled: true
    match:
      keywords: ["already complained", "complained before", "second time", "third time", "no action taken", "ஏற்கனவே புகார்", "पहले भी शिकायत", "pehle bhi complaint", "already call pannen", "already raised"]
    action:
      urgency_floor: high

  - id: R9
    name: Property tax and certificates
    enabled: true
    match:
      keywords: ["property tax", "சொத்து வரி", "संपत्ति कर", "birth certificate", "death certificate", "பிறப்பு சான்றிதழ்", "जन्म प्रमाण", "patta", "பட்டா"]
    action:
      department: revenue

  - id: R10
    name: Child or elderly at risk
    enabled: true
    match:
      keywords: ["kids are sick", "children sick", "child fell", "குழந்தை", "குழந்தைகள்", "बच्चे बीमार", "बच्चा गिर", "elderly", "old age", "முதியவர்", "बुजुर्ग", "pregnant", "கர்ப்பிணி", "गर्भवती"]
    action:
      urgency_floor: high
      force_review: true

  - id: R11
    name: Person or animal trapped (well, borewell, pit, lift)
    enabled: true
    match:
      keywords: ["fell into the well", "fell in the well", "fell into a well", "fallen into the well", "fallen in the well", "fallen into a well", "stuck in the well", "stuck in a well", "trapped in the well", "trapped in a well", "fell into the borewell", "fell in the borewell", "fell into a borewell", "fallen into the borewell", "fallen into a borewell", "stuck in the borewell", "trapped in the borewell", "fell into the pit", "fell into a pit", "stuck in the pit", "trapped in a pit", "stuck in the lift", "trapped in the lift", "stuck in a lift", "trapped in a lift", "fell into the drain", "stuck in the drain", "needs rescue", "rescue team", "கிணற்றில் விழுந்த", "கிணற்றில் சிக்கி", "கிணற்றுக்குள் விழுந்த", "போர்வெல்லில் விழுந்த", "ஆழ்துளை கிணற்றில் விழுந்த", "குழியில் விழுந்த", "குழியில் சிக்கி", "லிப்டில் சிக்கி", "மீட்பு குழு", "kinatril vizhunthu", "kinatril vizhundhu", "kinathula vizhunthu", "kinaru la vizhunthu", "kinaru la vizhundhu", "kinatril sikki", "borewell la vizhunthu", "lift la sikki", "कुएं में गिर", "कुएँ में गिर", "कुए में गिर", "कुएं में फंस", "कुएँ में फंस", "बोरवेल में गिर", "बोरवेल में फंस", "गड्ढे में गिर", "गड्ढे में फंस", "लिफ्ट में फंस", "बचाव दल", "kuen mein gir", "kuen me gir", "kue mein gir", "kue me gir", "kuan mein gir", "kuan me gir", "kuen mein fas", "kuen me phas", "borewell mein gir", "borewell me gir", "gadde mein gir", "gaddhe mein gir", "lift mein fas", "lift me phas", "lift mein phas"]
    action:
      department: safety
      urgency_floor: critical
      force_review: true

  - id: R12
    name: Snake, bee hive or wild animal inside a home
    enabled: true
    match:
      keywords: ["snake", "snakes", "cobra", "viper", "krait", "பாம்பு", "பாம்புகள்", "பாம்பை", "பாம்பின்", "நாகம்", "நல்ல பாம்பு", "सांप", "साँप", "नाग", "कोबरा", "paambu", "pambu", "paamboo", "saamp", "saanp", "samp", "sanp", "bee hive", "beehive", "honeycomb", "wasp nest", "hornets", "தேனீக்கூடு", "தேனீ கூடு", "குளவி கூடு", "मधुमक्खी का छत्ता", "मधुमक्खियों का छत्ता", "madhumakkhi", "leopard", "சிறுத்தை", "तेंदुआ", "wild animal", "monkey attack"]
    action:
      department: safety
      urgency_floor: high
      force_review: true
